name: Notify WPS

on:
  push:
  issues:
    types: [opened, closed]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build message
        id: msg
        run: |
          EVENT="${{ github.event_name }}"
          ACTOR="${{ github.actor }}"
          
          if [ "$EVENT" = "push" ]; then
            COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
            MSG="代码更新\n分支: ${{ github.ref_name }}\n提交者: ${ACTOR}\n信息: ${COMMIT_MSG}"
            
          elif [ "$EVENT" = "issues" ]; then
            ACTION="${{ github.event.action }}"
            TITLE="${{ github.event.issue.title }}"
            NUM="${{ github.event.issue.number }}"
            if [ "$ACTION" = "opened" ]; then
              MSG="新建 Issue #${NUM}\n标题: ${TITLE}\n创建者: ${ACTOR}"
            else
              MSG="关闭 Issue #${NUM}\n标题: ${TITLE}\n操作者: ${ACTOR}"
            fi
            
          elif [ "$EVENT" = "issue_comment" ]; then
            TITLE="${{ github.event.issue.title }}"
            NUM="${{ github.event.issue.number }}"
            # 获取前三行内容
            BODY=$(echo '${{ github.event.comment.body }}' | head -3)
            MSG="Issue #${NUM} 新评论\n标题: ${TITLE}\n评论者: ${ACTOR}\n内容:\n${BODY}"
          fi
          
          # 修复点 1：使用 EOF 语法处理多行变量，避免 Invalid format 错误
          {
            echo "msg<<EOF"
            echo -e "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send WPS Notification
        env:
          # 修复点 2：将带有特殊字符的消息放入环境变量，避免被解析截断
          MSG_CONTENT: "xiaoyi-query ${{ steps.msg.outputs.msg }}"
        run: |
          # 修复点 3：使用 jq 自动且安全地构建 JSON 数据，它会自动处理换行符和引号的转义
          PAYLOAD=$(jq -n --arg msg "$MSG_CONTENT" '{msgtype: "text", text: {content: $msg}}')
          
          curl -s -X POST \
            "https://365.kdocs.cn/woa/api/v1/webhook/send?key=${{ secrets.WPS_WEBHOOK_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
