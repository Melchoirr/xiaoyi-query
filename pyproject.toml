[project]
name = "xiaoyi-query"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135.1",
    "numpy>=2.4.3",
    "onnxruntime>=1.24.4",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "qdrant-client>=1.17.1",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.42.0",
    "xgboost>=3.2.0",
    "torch",
    "onnxscript>=0.6.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
